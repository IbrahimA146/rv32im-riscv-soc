name: regression

on:
  push:
  pull_request:

# Every step also writes its output to the job summary, which is readable on
# the run page without signing in - handy when the logs are not.
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install required tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog gcc-riscv64-unknown-elf

      - name: Install optional tools
        continue-on-error: true
        run: sudo apt-get install -y verilator

      - name: Environment
        run: |
          {
            echo '## Environment'
            echo '```'
            iverilog -V | head -1
            riscv64-unknown-elf-gcc --version | head -1
            echo "verilator: $(verilator --version 2>/dev/null || echo 'not installed')"
            echo "rv32 libc: $(riscv64-unknown-elf-gcc -march=rv32im -mabi=ilp32 -print-file-name=libc.a)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: ISA and random tests (Icarus, co-simulated against the ISS)
        run: |
          echo '## ISA + random' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python3 scripts/run_tests.py isa random -n 50 --sim=icarus 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tail -40
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Informational: the firmware needs an rv32 newlib, and how to link one
      # differs between toolchains. The CPU itself is verified by the steps
      # above and below, which need no C library at all.
      - name: Firmware (informational - needs an rv32 C library)
        continue-on-error: true
        run: |
          echo '## Firmware' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python3 scripts/run_tests.py fw --sim=icarus 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY" | tail -20
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Mutation testing
        run: |
          echo '## Mutation testing' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          python3 scripts/mutation_test.py 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" | tail -30
          status=$?
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Verilator lint and harness (optional)
        continue-on-error: true
        run: |
          command -v verilator >/dev/null || { echo "verilator not installed, skipping"; exit 0; }
          verilator --lint-only -Wall --timing -top soc_top \
            -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM -Wno-VARHIDDEN \
            rtl/core/rv32_pkg.sv $(ls rtl/core/*.sv | grep -v pkg) rtl/soc/*.sv
          python3 scripts/run_tests.py isa random -n 20 --sim=verilator
